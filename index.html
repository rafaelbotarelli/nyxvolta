<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nyx Volta</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header>

        <img src="imagens/microfone.png" >

        <h1>NYX VOLTA</h1>

        <h2>@nyxvolta</h2>

        <p>
            Produtora musical · Hip Hop<br>
            · R&B ·<br>
            São Paulo, BR
        </p>

        <section class="estatisticas">

            <div>
                <strong>999M</strong>
                <span>OUVINTES</span>
            </div>

            <div>
                <strong>50</strong>
                <span>LANÇAMENTOS</span>
            </div>

            <div>
                <strong>7</strong>
                <span>ÁLBUNS</span>
            </div>

        </section>

    </header>


    <main>

        <section class="lancamento">

            <div class="botao-play">
                <i class="fa-solid fa-play"></i>
            </div>

            <div class="informacoes">

                <span>NOVO LANÇAMENTO</span>

                <h3>Void Protocol EP</h3>

            </div>

            

        </section>


        <section class="plataformas">

            <div class="plataforma">

                <div class="icone">
                    <i class="fa-brands fa-spotify"></i>
                </div>

                <div class="textospotify">
                    <h3>Spotify</h3>
                    <p>Ouça Agora</p>
                </div>

            </div>


            <div class="plataforma">

                <div class="icone">
                    <i class="fa-brands fa-deezer"></i>
                </div>

                <div class="textodeezer">
                    <h3>Deezer</h3>
                    <p>Ouça Agora</p>
                </div>

            </div>


            <div class="plataforma">

                <div class="icone">
                    <i class="fa-brands fa-youtube"></i>
                </div>

                <div class="textoyoutube">
                    <h3>YouTube</h3>
                    <p>Videoclipes e produções</p>
                </div>

            </div>


            <div class="plataforma">

                <div class="icone">
                    <i class="fa-brands fa-soundcloud"></i>
                </div>

                <div class="textoscloud">
                    <h3>SoundCloud</h3>
                    <p>Beats exclusivos</p>
                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>nyxvolta.com</p>

    </footer>

</body>

</html>
